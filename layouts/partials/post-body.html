<article>
  <header>
    <h1><a href="{{ .RelPermalink }}" title="[Permalink] {{ .Title }}">{{ .Title }}</a></h1>
    <time>{{ .Date.Format "2 January 2006" }}</time>
  </header>
  {{- $toc := partial "toc.html" . -}}
  {{- if ne $toc "" }}
    <nav class="post-toc" aria-label="Table of Contents">
      {{ $toc }}
    </nav>
  {{- end }}
  <div class="post-content">
  {{ .Content }}
  </div>
</article>
