    </main>

    <script>
      function initSidenotes(root) {
        root = root || document;
        var maxDepth = 5;
        var processedAny;
        
        do {
          processedAny = false;
          // Find all unprocessed footnote links inside post content
          var footnoteLinks = root.querySelectorAll('.post-content a[href^="#fn:"]:not([data-sidenote-processed])');
          
          if (footnoteLinks.length === 0) break;
          
          footnoteLinks.forEach(function(link) {
            link.setAttribute('data-sidenote-processed', 'true');
            
            var sup = link.closest('sup') || link;
            var targetId = link.getAttribute('href').substring(1);
            var footnoteLi = document.getElementById(targetId);
            if (!footnoteLi) return;
            
            var uniqueId = 'sn-' + Math.random().toString(36).substr(2, 9);
            var clone = footnoteLi.cloneNode(true);
            var backRefs = clone.querySelectorAll('.footnote-backref, [role="doc-backlink"]');
            backRefs.forEach(function(el) { el.remove(); });
            
            var contentHtml = clone.innerHTML.trim();
            if (contentHtml.startsWith('<p>') && contentHtml.endsWith('</p>') && (contentHtml.match(/<p>/g) || []).length === 1) {
              contentHtml = contentHtml.substring(3, contentHtml.length - 4);
            }
            
            var label = document.createElement('label');
            label.setAttribute('for', uniqueId);
            label.className = 'margin-toggle sidenote-number';
            label.innerHTML = link.innerHTML;
            
            var checkbox = document.createElement('input');
            checkbox.setAttribute('type', 'checkbox');
            checkbox.setAttribute('id', uniqueId);
            checkbox.className = 'margin-toggle';
            
            var sidenoteSpan = document.createElement('aside');
            sidenoteSpan.className = 'sidenote';
            sidenoteSpan.setAttribute('role', 'note');
            sidenoteSpan.innerHTML = contentHtml;
            
            // Insert the toggle label, input, and sidenote inline consecutively
            sup.parentNode.insertBefore(label, sup);
            sup.parentNode.insertBefore(checkbox, sup);
            sup.parentNode.insertBefore(sidenoteSpan, sup);
            
            // Remove the original footnote superscript reference
            sup.remove();
            processedAny = true;
  
            // Click & Hover behavior to keep highlighted until clicked again or another is hovered
            label.addEventListener('click', function(e) {
              if (window.innerWidth > 960) {
                e.preventDefault();
                e.stopPropagation();
                var isActive = sidenoteSpan.classList.contains('active-highlight');
                
                // Clear active highlight and alignment from all other sidenotes and labels
                document.querySelectorAll('.sidenote').forEach(function(el) {
                  el.classList.remove('active-highlight');
                  el.style.transform = '';
                });
                document.querySelectorAll('.sidenote-number').forEach(function(el) {
                  el.classList.remove('active-label');
                });
                
                if (!isActive) {
                  sidenoteSpan.classList.add('active-highlight');
                  label.classList.add('active-label');
                  
                  // Calculate vertical offset and slide sidenote to align with superscript
                  sidenoteSpan.style.transform = 'none'; // reset to measure base position
                  var labelTop = label.getBoundingClientRect().top;
                  var sidenoteTop = sidenoteSpan.getBoundingClientRect().top;
                  var diff = labelTop - sidenoteTop;
                  sidenoteSpan.style.transform = 'translateY(' + diff + 'px)';
                }
              }
            });
  
            label.addEventListener('mouseenter', function() {
              if (window.innerWidth > 960) {
                document.querySelectorAll('.sidenote').forEach(function(el) {
                  el.classList.remove('active-highlight');
                  el.style.transform = '';
                });
                document.querySelectorAll('.sidenote-number').forEach(function(el) {
                  el.classList.remove('active-label');
                });
              }
            });
          });
          
          maxDepth--;
        } while (processedAny && maxDepth > 0);
        
        // Hide the original footnotes bottom section
        var footnotesSections = root.querySelectorAll('.footnotes');
        footnotesSections.forEach(function(el) {
          el.style.display = 'none';
        });
      }

      var currentTocArticle = null;

      function updateSidebarToc() {
        var sidebarToc = document.getElementById('sidebar-toc');
        if (!sidebarToc) return;

        var articles = Array.prototype.slice.call(document.querySelectorAll('#content article'));
        if (articles.length === 0) {
          sidebarToc.hidden = true;
          return;
        }

        // Determine which article is currently in view
        var activeArticle = articles[0];
        var threshold = 160;
        for (var i = 0; i < articles.length; i++) {
          var rect = articles[i].getBoundingClientRect();
          if (rect.top <= threshold && rect.bottom > threshold) {
            activeArticle = articles[i];
            break;
          } else if (rect.top > threshold && i === 0) {
            activeArticle = articles[0];
            break;
          } else if (rect.top <= threshold) {
            activeArticle = articles[i];
          }
        }

        var postToc = activeArticle ? activeArticle.querySelector('.post-toc') : null;
        if (!postToc) {
          sidebarToc.hidden = true;
          currentTocArticle = null;
          return;
        }

        // Sync sidebar TOC HTML when switching between articles
        if (currentTocArticle !== activeArticle) {
          currentTocArticle = activeArticle;
          sidebarToc.innerHTML = postToc.innerHTML;
          sidebarToc.hidden = false;

          // Scope anchor clicks to headings inside the active article
          sidebarToc.querySelectorAll('a[href^="#"]').forEach(function(link) {
            link.addEventListener('click', function(e) {
              var hash = link.getAttribute('href');
              if (!hash || hash.length < 2) return;
              var id = decodeURIComponent(hash.substring(1));
              var target = currentTocArticle.querySelector('[id="' + CSS.escape(id) + '"]');
              if (target) {
                e.preventDefault();
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                history.replaceState(null, '', hash);
              }
            });
          });
        }

        // Highlight active heading in sidebar TOC
        var tocLinks = Array.prototype.slice.call(sidebarToc.querySelectorAll('a[href^="#"]'));
        var activeLink = null;
        var headingOffset = 100;

        for (var j = 0; j < tocLinks.length; j++) {
          var href = tocLinks[j].getAttribute('href');
          if (!href || href.length < 2) continue;
          var targetId = decodeURIComponent(href.substring(1));
          var headingEl = activeArticle.querySelector('[id="' + CSS.escape(targetId) + '"]');
          if (headingEl) {
            var hRect = headingEl.getBoundingClientRect();
            if (hRect.top <= headingOffset) {
              activeLink = tocLinks[j];
            } else {
              break;
            }
          }
        }

        tocLinks.forEach(function(link) {
          if (link === activeLink) {
            link.classList.add('active');
          } else {
            link.classList.remove('active');
          }
        });
      }
 
      window.addEventListener('DOMContentLoaded', function() {
        initSidenotes();
        updateSidebarToc();
        
        var postsContainer = document.querySelector('#posts');
        if (postsContainer) {
          var infScroll = new InfiniteScroll( '#posts', {
            path: '.pagination__next',
            append: 'article',
            history: true,
          });
   
          infScroll.on('append', function(event, response, path, items) {
            if (items) {
              for (var i = 0; i < items.length; i++) {
                initSidenotes(items[i]);
              }
            }
            updateSidebarToc();
          });
        }

        var scrollTicking = false;
        window.addEventListener('scroll', function() {
          if (!scrollTicking) {
            window.requestAnimationFrame(function() {
              updateSidebarToc();
              scrollTicking = false;
            });
            scrollTicking = true;
          }
        }, { passive: true });

        // Realign active sidenote and update TOC on window resize
        window.addEventListener('resize', function() {
          if (window.innerWidth > 960) {
            var activeLabel = document.querySelector('.sidenote-number.active-label');
            var activeSidenote = document.querySelector('.sidenote.active-highlight');
            if (activeLabel && activeSidenote) {
              activeSidenote.style.transform = 'none';
              var labelTop = activeLabel.getBoundingClientRect().top;
              var sidenoteTop = activeSidenote.getBoundingClientRect().top;
              var diff = labelTop - sidenoteTop;
              activeSidenote.style.transform = 'translateY(' + diff + 'px)';
            }
          } else {
            document.querySelectorAll('.sidenote').forEach(function(el) {
              el.style.transform = '';
            });
          }
          updateSidebarToc();
        });
      });
    </script>
  </body>
</html>
